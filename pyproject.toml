[project]
name = "student-portal"
version = "0.6.0"
description = "Система управління студентами"
readme = "README.md"
authors = [
    { name = "Галух Анна Олександрівна", email = "90985892+asiaglh@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2,<6.2",
]

[project.scripts]
student-portal = "student_portal:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0,<5",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"config/settings.py" = ["E501"]

[tool.mypy]
strict = true

[tool.pytest]
minversion = "9.0"
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = ["-ra"]
strict = true

[tool.coverage.run]
branch = true
source = ["student_portal", "students"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90
